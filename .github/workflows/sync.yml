name: Sync prompt to AI instruction files

on:
  push:
    branches: [main]
    paths: [prompt.md, scripts/sync.sh]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/sync.sh
      - name: Commit changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Sync AI instruction files from prompt.md"
            git push
          fi
